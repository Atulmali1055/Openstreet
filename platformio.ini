[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- Fix for ip_addr_t / CONFIG_TCPIP_LWIP ---
custom_sdkconfig = CONFIG_TCPIP_LWIP=y
build_flags = -DCONFIG_TCPIP_LWIP=1

; --- PSRAM (required by OpenStreetMap-esp32) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

lib_deps =
    celliesprojects/OpenStreetMap-esp32@^1.2.2
    lovyan03/LovyanGFX@^1.2.7
    bitbank2/PNGdec@^1.1.3